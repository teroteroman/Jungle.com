<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>jungle</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="jungle">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">

<link id="app-icon" rel="icon" type="image/png">
<link id="apple-icon" rel="apple-touch-icon">

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background-color: #ffffff;
    color: #202124;
  }
  .top-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 14px 20px;
    gap: 16px;
    font-size: 13px;
    color: #3c4043;
  }
  .apps-grid {
    width: 20px;
    height: 20px;
    display: grid;
    grid-template-columns: repeat(3, 4px);
    gap: 3px;
    align-content: center;
    justify-content: center;
    opacity: 0.6;
  }
  .apps-grid span {
    width: 4px;
    height: 4px;
    background: #5f6368;
    border-radius: 50%;
  }
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #4285F4;
    color: #ffffff;
    font-weight: bold;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #home-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .home-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 20px 80px;
  }
  .logo {
    font-size: 74px;
    font-weight: bold;
    letter-spacing: -2px;
    margin-bottom: 26px;
    user-select: none;
  }
  .c-blue { color: #4285F4; }
  .c-red { color: #EA4335; }
  .c-yellow { color: #FBBC05; }
  .c-green { color: #34A853; }
  .search-box {
    width: 580px;
    max-width: 100%;
    height: 48px;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    background: #ffffff;
    box-shadow: 0 2px 8px rgba(32,33,36,0.12);
  }
  .search-icon {
    width: 18px;
    height: 18px;
    margin-right: 12px;
    fill: #9aa0a6;
    flex-shrink: 0;
  }
  .search-input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 16px;
    background: transparent;
  }
  .buttons {
    margin-top: 28px;
    display: flex;
    gap: 12px;
  }
  .btn {
    background-color: #f8f9fa;
    border: 1px solid #f8f9fa;
    border-radius: 6px;
    color: #3c4043;
    font-size: 14px;
    padding: 0 18px;
    height: 38px;
    cursor: pointer;
  }
  #result-screen {
    display: none;
    background-color: #f8f9fa;
    min-height: 100vh;
  }
  .result-header {
    background: #ffffff;
    padding: 14px 24px 0;
    border-bottom: 1px solid #ebebeb;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .mini-logo {
    font-size: 26px;
    font-weight: bold;
    letter-spacing: -1px;
    cursor: pointer;
    user-select: none;
  }
  .header-search {
    flex: 1;
    max-width: 600px;
    height: 42px;
    box-shadow: 0 1px 5px rgba(32,33,36,0.12);
  }
  .tabs {
    display: flex;
    gap: 22px;
    margin-top: 14px;
    padding-left: 110px;
    font-size: 14px;
    color: #5f6368;
    overflow-x: auto;
  }
  .tab {
    padding-bottom: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active {
    color: #1a73e8;
    border-bottom: 3px solid #1a73e8;
    font-weight: bold;
  }
  .results-container {
    max-width: 660px;
    margin: 0 0 0 130px;
    padding: 16px 20px 60px;
  }
  .result-stats {
    color: #70757a;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .result-item {
    background: #ffffff;
    padding: 16px 18px;
    border-radius: 10px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .result-site {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .site-icon {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #f1f3f4;
    color: #5f6368;
    font-size: 12px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .site-info {
    display: flex;
    flex-direction: column;
  }
  .site-name {
    font-size: 13px;
    color: #202124;
  }
  .result-url {
    font-size: 12px;
    color: #4d5156;
  }
  .result-title {
    font-size: 18px;
    color: #1a0dab;
    display: inline-block;
    margin-bottom: 6px;
    cursor: pointer;
    line-height: 1.35;
  }
  .result-desc {
    font-size: 14px;
    color: #4d5156;
    line-height: 1.5;
  }
  .pagination {
    margin-top: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 14px;
    user-select: none;
    flex-wrap: wrap;
  }
  .page-logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: -1px;
    margin-right: 6px;
  }
  .page-num, .page-nav {
    color: #4285F4;
    cursor: pointer;
    padding: 4px 6px;
  }
  .page-num.active {
    color: #202124;
    font-weight: bold;
    cursor: default;
  }
  @media (max-width: 768px) {
    .logo { font-size: 52px; }
    .buttons { display: none; }
    .result-header { padding: 12px 14px 0; }
    .header-top { flex-wrap: wrap; gap: 10px; }
    .mini-logo { width: 100%; text-align: center; font-size: 24px; }
    .tabs { padding-left: 4px; gap: 18px; }
    .results-container { margin: 0 auto; padding: 12px 10px 50px; }
    .result-item { border-radius: 12px; padding: 14px; }
  }
</style>
</head>
<body>

  <div id="home-screen">
    <div class="top-bar">
      <span>画像</span>
      <div class="apps-grid">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
      <div class="avatar">J</div>
    </div>

    <div class="home-center">
      <div class="logo">
        <span class="c-blue">j</span><span class="c-red">u</span><span class="c-yellow">n</span><span class="c-blue">g</span><span class="c-green">l</span><span class="c-red">e</span>
      </div>
      <form class="search-box" onsubmit="doSearch(event, 'home-input')">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="home-input" class="search-input" placeholder="検索または URL を入力" autofocus>
      </form>
      <div class="buttons">
        <button class="btn" onclick="doSearch(event, 'home-input')">jungle 検索</button>
        <button class="btn" onclick="doSearch(event, 'home-input')">I'm Feeling Lucky</button>
      </div>
    </div>
  </div>

  <div id="result-screen">
    <div class="result-header">
      <div class="header-top">
        <div class="mini-logo" onclick="goHome()">
          <span class="c-blue">j</span><span class="c-red">u</span><span class="c-yellow">n</span><span class="c-blue">g</span><span class="c-green">l</span><span class="c-red">e</span>
        </div>
        <form class="search-box header-search" onsubmit="doSearch(event, 'result-input')">
          <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="result-input" class="search-input">
        </form>
      </div>
      <div class="tabs">
        <div class="tab active">すべて</div>
        <div class="tab">ニュース</div>
        <div class="tab">画像</div>
        <div class="tab">動画</div>
        <div class="tab">ショッピング</div>
      </div>
    </div>

    <div class="results-container">
      <div class="result-stats" id="result-stats"></div>
      <div id="results-list"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

<script>

    var canvas = document.createElement('canvas');

    canvas.height = 512;
    var ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 512, 512);

    ctx.fillStyle = '#4285F4';
    ctx.font = 'bold 420px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('J', 256, 280);

    var pngUrl = canvas.toDataURL('image/png');
    document.getElementById('app-icon').href = pngUrl;
    document.getElementById('apple-icon').href = pngUrl;
  })();
